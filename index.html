<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>현수막 게시 관리</title>
<style>
  :root{--bg:#f3f5f8;--card:#fff;--line:#e3e7ed;--line2:#d3d9e1;--text:#18202b;--sub:#5d6979;--blue:#1d4ed8;--navy:#14243b;
    --g:#e5f4ea;--gT:#17663a;--y:#fff4d4;--yT:#8a5a00;--r:#fde7e4;--rT:#b42318;--gray:#eef1f5;
    --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06)}
  *{box-sizing:border-box}
  body{margin:0;font-family:Pretendard,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}
  header{background:var(--navy);color:#fff;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  header .ttl{display:flex;flex-direction:column}
  header .org{font-size:13px;opacity:.7;font-weight:500;letter-spacing:.02em}
  h1{font-size:23px;margin:0;font-weight:700;letter-spacing:-.02em}
  h2{font-size:19px;margin:0 0 14px;font-weight:700;letter-spacing:-.02em}
  header .me{color:#c7d2e0;font-size:14px;display:flex;align-items:center;gap:10px}
  header .out{background:transparent;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:5px 10px;font-size:13px;cursor:pointer;font-family:inherit}
  .login{max-width:520px;margin:60px auto;text-align:center}
  .login h2{font-size:22px;margin-bottom:8px}
  .gbtn{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line2);border-radius:10px;padding:13px 22px;font-size:17px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--text);margin-top:18px}
  .gbtn:hover{background:var(--gray)}
  .gbtn i{width:20px;height:20px;border-radius:50%;background:conic-gradient(#ea4335 0 25%,#fbbc05 0 50%,#34a853 0 75%,#4285f4 0)}
  .me{color:var(--sub);font-size:14px}
  nav{display:flex;gap:6px;padding:10px 24px;background:#fff;border-bottom:1px solid var(--line);overflow-x:auto;position:sticky;top:0;z-index:5}
  nav button{border:0;background:none;padding:10px 18px;border-radius:999px;cursor:pointer;font-size:16px;font-weight:600;color:var(--sub);white-space:nowrap;font-family:inherit}
  nav button:hover{background:var(--gray)}
  nav button.on{background:var(--navy);color:#fff}
  nav .cnt{display:inline-block;background:#ef4444;color:#fff;border-radius:999px;font-size:12px;padding:1px 7px;margin-left:6px;vertical-align:1px}
  main{max-width:1880px;margin:0 auto;padding:24px 32px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:20px;box-shadow:var(--shadow)}
  .bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
  button.b{border:1px solid var(--line2);background:#fff;border-radius:10px;padding:9px 16px;cursor:pointer;font-size:15px;font-weight:600;font-family:inherit;color:var(--text)}
  button.b:hover{background:var(--gray)}
  button.p{background:var(--blue);border-color:var(--blue);color:#fff}
  button.p:hover{background:#1e40af}
  button.d{color:var(--rT)}
  button:disabled{opacity:.5;cursor:default}
  .wrap{overflow-x:auto}
  table{border-collapse:separate;border-spacing:0;width:100%;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px;text-align:center;font-size:14px}
  tr:last-child td{border-bottom:0} th:last-child,td:last-child{border-right:0}
  th{background:#f8fafc;font-weight:600;color:var(--sub);white-space:nowrap}
  th.sat{color:#1d4ed8} th.sun{color:#dc2626}
  td.place{text-align:left;font-weight:700;white-space:nowrap;background:#fff}
  td.c{cursor:pointer;min-width:56px}

  td.c small{font-size:12px}
  td.g{background:var(--g);color:var(--gT)} td.y{background:var(--y);color:var(--yT)} td.r{background:var(--r);color:var(--rT)}
  td.past{background:var(--gray);color:#a0a9b5}
  .legend{font-size:14px;color:var(--sub);display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
  .legend span::before{content:"";display:inline-block;width:12px;height:12px;margin-right:6px;border-radius:3px;vertical-align:-1px;background:var(--c)}
  .legend span:not([style])::before{display:none}
  .item{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start;background:#fff}
  .item .t{font-weight:700;font-size:17px}
  .item .s{color:var(--sub);font-size:14px;margin-top:4px;line-height:1.6}
  .item .q{margin-top:8px;padding:10px 12px;background:#f6f8fb;border-radius:8px;font-size:15px;white-space:pre-wrap}
  .acts{display:flex;gap:8px;flex-wrap:wrap}
  .tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;margin-left:8px;font-weight:600;vertical-align:2px}
  .t대기{background:var(--y);color:var(--yT)} .t승인,.t게시{background:var(--g);color:var(--gT)}
  .t반려,.t철거필요{background:var(--r);color:var(--rT)} .t취소,.t철거완료{background:var(--gray);color:var(--sub)}
  label.f{display:block;margin-bottom:16px}
  label.f > span{display:block;font-size:14px;font-weight:600;color:var(--sub);margin-bottom:6px}
  input[type=text],input[type=date],textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line2);border-radius:10px;font-size:16px;font-family:inherit;background:#fff;color:var(--text)}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(29,78,216,.15)}
  textarea{min-height:80px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:640px){.row2{grid-template-columns:1fr} main{padding:14px} header{padding:14px 16px} nav{padding:8px 12px} .card{padding:16px}}
  .places label{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line2);border-radius:10px;margin-bottom:8px;cursor:pointer;font-size:16px;font-weight:600}
  .places label.no{color:#a0a9b5;background:var(--gray);cursor:default}
  .places input{width:18px;height:18px}
  .places small{margin-left:auto;color:var(--sub);font-size:14px;font-weight:500}
  .msg{padding:14px 16px;border-radius:12px;margin-bottom:16px;font-size:15px;line-height:1.7}
  .msg.err{background:var(--r);color:var(--rT)} .msg.ok{background:var(--g);color:var(--gT)} .msg.info{background:#eef4ff;color:#1e3a8a}
  .empty{color:var(--sub);font-size:15px;padding:8px 0}
  #loading{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;font-size:17px;font-weight:600;z-index:9}
  .sec{margin-top:20px}
  .narrow{max-width:1240px;margin-left:auto;margin-right:auto}
  /* 게시대 모양 */
  .boards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));gap:28px}
  .board{display:grid;grid-row:span 2;grid-template-rows:subgrid;grid-template-columns:minmax(0,1fr);row-gap:0;min-width:0}
  .stand{display:flex;flex-direction:column;min-width:0}
  .boards{grid-auto-rows:auto}
  .board{--pc:#1f4e8c;--pl:#e8eef8;--pf:#7f97bd}
  .frame{flex:1;border-left:7px solid var(--pf);border-right:7px solid var(--pf);padding:14px 14px 6px;background:var(--pl);border-top:7px solid var(--pf);border-radius:6px 6px 0 0}
  .slot{margin-bottom:14px;position:relative;padding-left:34px}
  .slot .no{position:absolute;left:0;top:18px;font-size:14px;font-weight:800;color:var(--pc)}
  .bn{min-height:62px;border-radius:6px;padding:8px 16px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;overflow:hidden;box-shadow:0 2px 6px rgba(16,24,40,.12);transition:transform .1s}
  .bn:hover{transform:translateY(-1px)}
  .bn .bt{font-weight:700;font-size:18px;line-height:1.35;letter-spacing:-.02em;word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .bn .bd{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85;margin-top:2px}
  .bn.on{background:var(--pc);color:#fff}

  .per.late{color:#dc2626;font-weight:700}
  .rsvbox{margin-top:12px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:8px;padding:10px 12px}
  .rsvh{font-weight:700;font-size:15px;color:var(--pc);margin-bottom:6px}
  .rsv-none{font-size:14px;color:var(--sub);padding:4px 0}
  .rsv-i{min-width:0;display:flex;align-items:center;gap:10px;padding:8px 6px;border-top:1px solid #eef1f5;cursor:pointer;font-size:14px;border-radius:6px}
  .rsv-i:first-of-type{border-top:0}
  .rsv-i:hover{background:#f6f8fb}
  .rsv-i.pick{outline:2px solid #f59e0b}
  .rsv-no{flex:none;width:38px;text-align:center;font-weight:800;font-size:13px;color:#fff;background:var(--pc);border-radius:5px;padding:2px 0}
  .rsv-i.w .rsv-no{background:#d9a400}
  .rsv-d{flex:none;font-weight:700;color:var(--text);white-space:nowrap}
  .rsv-t{flex:1;min-width:0;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rsv-tag{flex:none;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--y);color:var(--yT)}
  .rsv-tag.ok{background:var(--g);color:var(--gT)}
  .bn.empty{background:rgba(255,255,255,.75);border:2px dashed #c3c9d1;color:#98a2b0;box-shadow:none;align-items:center;font-size:15px;font-weight:600}
  .bn.empty:hover{border-color:var(--pc);color:var(--pc)}
  .bn.past{cursor:default}
  .bn.past:hover{transform:none}
  .bn.pick{outline:3px solid #f59e0b;outline-offset:2px}
  .per{font-size:14px;color:var(--sub);text-align:center;margin-top:5px;min-height:18px}
  .per b{color:var(--text);font-weight:700}
  .legs{display:flex;justify-content:space-between;height:28px}
  .legs i{width:7px;background:var(--pf);margin:0 14%}
  .base{background:var(--pc);color:#fff;text-align:center;padding:12px 8px;border-radius:8px;font-weight:700;font-size:19px;letter-spacing:-.02em;box-shadow:0 2px 6px rgba(16,24,40,.15)}
  .base small{display:block;font-weight:500;font-size:14px;opacity:.9;margin-top:2px}
  details.more summary{cursor:pointer;color:var(--blue);font-size:16px;font-weight:600}
  .datebar b{font-size:20px}
</style>
</head>
<body>
<header>
  <div class="ttl"><span class="org">청암대학교 취업지원센터</span><h1>현수막 게시 관리</h1></div>
  <div class="me" id="me">불러오는 중…</div>
</header>
<nav id="nav"></nav>
<main id="main"></main>
<div id="loading">처리 중…</div>

<script src="config.js"></script>
<script>
let D = null, 탭 = '현황', 알림 = null;

/* ---------- 날짜 ---------- */
function 값(s){const p=s.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2]);}
function 문(t){const d=new Date(t);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0');}
function 더하기(s,n){return 문(값(s)+n*86400000);}
function 차이(a,b){return Math.round((값(b)-값(a))/86400000);}
function 요일(s){return '일월화수목금토'[new Date(값(s)).getUTCDay()];}
function 짧게(s){const p=s.split('-');return Number(p[1])+'/'+Number(p[2]);}
function 평일수(a,b){let n=0;for(let d=a;d<=b;d=더하기(d,1)){const w=new Date(값(d)).getUTCDay();if(w!==0&&w!==6)n++;}return n;}
function 게시일수(a,b){return D&&D.set.평일!==false?평일수(a,b):차이(a,b)+1;}
function 일수글(a,b){const 달력=차이(a,b)+1;return D&&D.set.평일!==false?'평일 '+평일수(a,b)+'일('+달력+'일)':달력+'일';}
function 평일더하기(a,n){let d=a,k=0;for(let i=0;i<400;i++){const w=new Date(값(d)).getUTCDay();if(w!==0&&w!==6){k++;if(k>=n)return d;}d=더하기(d,1);}return d;}
function 단위(){return D.set.평일!==false?'평일 ':'';}
function 기간(o){return 짧게(o.시작)+'('+요일(o.시작)+') ~ '+짧게(o.종료)+'('+요일(o.종료)+') · '+일수글(o.시작,o.종료);}

/* ---------- 공통 ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function 처리중(on){document.getElementById('loading').style.display=on?'flex':'none';}
/* ---------- Supabase 연결 (로그인 + 기능 호출) ---------- */
const CFG=window.BANNER_CONFIG||{};
const 주소=String(CFG.SUPABASE_URL||'').replace(/\/+$/,''), 공개키=CFG.SUPABASE_ANON_KEY||'', 도메인=CFG.DOMAIN||'scjc.ac.kr';
const 세션키='banner_session_v1';
let 세션=null;
function 세션읽기(){try{return JSON.parse(localStorage.getItem(세션키)||'null');}catch(e){return null;}}
function 세션저장(v){세션=v;try{v?localStorage.setItem(세션키,JSON.stringify(v)):localStorage.removeItem(세션키);}catch(e){}}
function 돌아올주소(){return location.origin+location.pathname;}
function 로그인(){
  location.href=주소+'/auth/v1/authorize?provider=google&redirect_to='+encodeURIComponent(돌아올주소())+
    '&hd='+encodeURIComponent(도메인)+'&prompt=select_account';
}
function 로그아웃(){
  const t=세션&&세션.access_token;세션저장(null);D=null;
  if(t)fetch(주소+'/auth/v1/logout',{method:'POST',headers:{apikey:공개키,Authorization:'Bearer '+t}}).catch(()=>{});
  로그인화면();
}
/* 구글 로그인 뒤 주소 뒤(#)에 붙어 오는 토큰 받기 */
function 토큰받기(){
  if(!location.hash||location.hash.length<2)return null;
  const p=new URLSearchParams(location.hash.slice(1));
  history.replaceState(null,'',돌아올주소()+location.search);
  if(p.get('error_description'))return {오류:p.get('error_description')};
  if(!p.get('access_token'))return null;
  세션저장({access_token:p.get('access_token'),refresh_token:p.get('refresh_token'),
    expires_at:Math.floor(Date.now()/1000)+Number(p.get('expires_in')||3600)});
  return {ok:true};
}
async function 토큰갱신(){
  if(!세션||!세션.refresh_token)throw {로그인:true};
  const r=await fetch(주소+'/auth/v1/token?grant_type=refresh_token',{method:'POST',
    headers:{apikey:공개키,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:세션.refresh_token})});
  if(!r.ok){세션저장(null);throw {로그인:true};}
  const j=await r.json();
  세션저장({access_token:j.access_token,refresh_token:j.refresh_token,expires_at:Math.floor(Date.now()/1000)+Number(j.expires_in||3600)});
}
async function 기능(이름,값,다시){
  if(!세션)throw {로그인:true};
  if(!세션.expires_at||세션.expires_at-60<Date.now()/1000)await 토큰갱신();
  let r;
  try{
    r=await fetch(주소+'/rest/v1/rpc/'+이름,{method:'POST',
      headers:{apikey:공개키,Authorization:'Bearer '+세션.access_token,'Content-Type':'application/json'},body:JSON.stringify(값||{})});
  }catch(e){throw new Error('서버에 연결하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해 주세요.');}
  if(r.status===401&&!다시){await 토큰갱신();return 기능(이름,값,true);}
  const txt=await r.text();let j=null;try{j=txt?JSON.parse(txt):null;}catch(e){}
  if(!r.ok)throw new Error((j&&(j.message||j.error_description||j.error))||('오류 '+r.status));
  return j;
}
const 함수표={
  webData:['web_data',()=>({})],
  webApply:['web_apply',f=>({f:f})],
  webAddExisting:['web_add_existing',f=>({f:f})],
  webEditGroup:['web_edit_group',(id,f)=>({p_id:id,f:f})],
  webCancel:['web_cancel',id=>({p_id:id})],
  webDecide:['web_decide',(id,k,why)=>({p_id:id,p_decision:k,p_reason:why||''})],
  webRemoved:['web_removed',id=>({p_id:id})],
  webMoveSlot:['web_move_slot',(id,n)=>({p_id:id,p_slot:Number(n)})]
};
function 실행(함수,인자,성공){
  처리중(true);
  const [이름,변환]=함수표[함수];
  기능(이름,변환.apply(null,인자||[])).then(r=>{처리중(false);성공&&성공(r);})
    .catch(e=>{처리중(false);if(e&&e.로그인){로그인화면('로그인이 끝났습니다. 다시 로그인해 주세요.');return;}
      알림={k:'err',t:(e&&e.message)||String(e)};그리기();});
}
function 로그인화면(메시지){
  document.getElementById('nav').innerHTML='';
  document.getElementById('me').innerHTML='';
  document.getElementById('main').innerHTML='<div class="card login"><h2>현수막 게시 관리</h2>'+
    '<div class="me" style="justify-content:center">학교 구글 계정(@'+esc(도메인)+')으로 로그인해 주세요.</div>'+
    (메시지?'<div class="msg err" style="margin-top:16px">'+esc(메시지)+'</div>':'')+
    '<button class="gbtn" onclick="로그인()"><i></i>학교 구글 계정으로 로그인</button>'+
    '<div class="me" style="justify-content:center;margin-top:18px;font-size:13px">처음 한 번은 구글 계정 선택 화면이 나옵니다.</div></div>';
}
function 불러오기(다음){
  const 늦음=setTimeout(()=>{if(!D){알림={k:'err',t:'서버 응답이 늦습니다 (20초 넘음). 새로고침해 보고, 계속 안 되면 관리자에게 알려 주세요.'};처리중(false);그리기();}},20000);
  실행('webData',[],d=>{clearTimeout(늦음);D=d;if(알림&&알림.k==='err')알림=null;다음&&다음();그리기();});
}
function 직접(o){return o.초과사유==='기존 게시분 등록'||o.초과사유==='관리자 직접 등록';}
function 사용중(o){return o.상태==='대기'||o.상태==='승인';}
function 상태표시(o){
  if(o.상태==='승인'){
    if(o.종료<D.오늘)return['철거 필요','철거필요'];
    if(o.시작<=D.오늘)return['게시 중','게시'];

  }

function 칸배치(장소,d){
  const L=그날목록(장소,d).sort((a,b)=>a.시작.localeCompare(b.시작)||a.번호.localeCompare(b.번호));
  const N=칸수(장소), out=new Array(N).fill(null), 남은=[];
  L.forEach(o=>{if(o.칸>=1&&o.칸<=N&&!out[o.칸-1])out[o.칸-1]=o;else 남은.push(o);});
  for(let i=0;i<out.length&&남은.length;i++)if(!out[i])out[i]=남은.shift();

/* 기간 내내 비어 있는 칸 번호 목록 */
function 빈칸목록(장소,a,b,제외){
  const 대상=D.rows.filter(o=>o.번호!==제외&&o.장소===장소&&사용중(o)&&o.시작<=b&&끝(o)>=a);
  const r=[];
  const N=칸수(장소);
  for(let n=1;n<=N;n++){
    if(대상.some(o=>o.칸===n))continue;
    let ok=true;
    for(let d=a;d<=b&&ok;d=더하기(d,1)){
      const 그날=대상.filter(o=>o.시작<=d&&끝(o)>=d);
      const 쓴=new Set(그날.filter(o=>o.칸).map(o=>o.칸));let 빈=0;
      for(let k=1;k<=N;k++)if(!쓴.has(k)&&k!==n)빈++;
      if(그날.filter(o=>!o.칸).length>빈)ok=false;
    }
    if(ok)r.push(n);
  }
  return r;
}
function 최소남은(장소,a,b){
  let m={남은:칸수(장소),날짜:a};
  for(let d=a;d<=b;d=더하기(d,1)){const n=칸수(장소)-그날목록(장소,d).length;if(n<m.남은)m={남은:n,날짜:d};}
  return m;
}

/* 게시 현황에서 칸 누르기: 관리자는 관리 화면으로 */
function 칸누름(번호){
  if(D.admin){탭='관리';직접열기=false;알림=null;수정열기(번호);return;}
  선택번호=번호;그리기();
}
function 빈칸누름(p,n,d){
  if(!D.admin){신청시작(p,d);return;}
  let 종료=D.set.평일!==false?평일더하기(d,D.set.기본일):더하기(d,D.set.기본일-1);
  const 다음=D.rows.filter(o=>o.장소===p&&o.칸===n&&사용중(o)&&o.시작>d).sort((a,b)=>a.시작.localeCompare(b.시작))[0];
  if(다음&&다음.시작<=종료)종료=더하기(다음.시작,-1);
  기존초안={장소들:[p],칸지정:{[p]:n},시작:d,종료:종료};
  탭='관리';직접열기=true;수정번호=null;알림={k:'info',t:p+' '+n+'번 칸, '+짧게(d)+' ~ '+짧게(종료)+' 로 등록합니다.'+(다음&&다음.시작>d&&더하기(다음.시작,-1)===종료?' (이 칸은 '+짧게(다음.시작)+'부터 예약이 있어 그 전날까지로 맞췄습니다)':'')+' 내용을 채우고 등록을 누르세요.'};그리기();
  const el=document.getElementById('g부서');if(el){el.scrollIntoView({block:'center'});el.focus();}
}
function 칸옵션(p){const N=칸수(p);return '<option value="">자동 (비어 있는 맨 위 칸)</option>'+Array.from({length:N},(_,i)=>'<option value="'+(i+1)+'">'+(i+1)+'번'+(i===0?' (맨 위)':i===N-1?' (맨 아래)':'')+'</option>').join('');}
/* 직접 등록: 날짜가 정해지면 칸마다 사용 중인지 표시 */
function 직접칸갱신(){
  const a=(document.getElementById('g시작')||{}).value, b=(document.getElementById('g종료')||{}).value;
  document.querySelectorAll('#g장소들 select.g칸').forEach(sel=>{
    const p=sel.dataset.p, N=칸수(p), 전=sel.value;
    let opts='<option value="">자동 (빈 칸 중 맨 위)</option>';
    for(let n=1;n<=N;n++){
      let 표시='';
      if(a&&b&&b>=a){
        const 겹=D.rows.find(o=>o.장소===p&&o.칸===n&&사용중(o)&&o.시작<=b&&끝(o)>=a);
        if(겹)표시=' — 사용 중: '+(겹.부서||'')+' '+짧게(겹.시작)+'~'+짧게(겹.종료);
      }
      opts+='<option value="'+n+'"'+(표시?' disabled':'')+'>'+n+'번'+(n===1?' (맨 위)':n===N?' (맨 아래)':'')+표시+'</option>';
    }
    sel.innerHTML=opts;
    const 지정=(기존초안.칸지정||{})[p];
    if(지정&&sel.querySelector('option[value="'+지정+'"]:not([disabled])'))sel.value=String(지정);
    else if(전&&sel.querySelector('option[value="'+전+'"]:not([disabled])'))sel.value=전;
  });
}
function 기존등록(){
  const g=k=>document.getElementById('g'+k).value.trim();
  const 장소목록=[...document.querySelectorAll('#g장소들 label')].filter(l=>l.querySelector('input').checked)
    .map(l=>({장소:l.querySelector('input').value,칸:l.querySelector('select').value}));
  const f={장소목록:장소목록,부서:g('부서'),행사명:g('행사명'),문구:g('문구'),시작:g('시작'),종료:g('종료'),담당자:g('담당자'),연락처:g('연락처')};
  if(!장소목록.length){알림={k:'err',t:'장소를 한 곳 이상 고르세요.'};그리기();return;}
  실행('webAddExisting',[f],r=>{
    기존초안={장소들:장소목록.map(x=>x.장소),부서:f.부서,시작:f.시작,종료:f.종료};직접열기=false;
    알림={k:r.알림.length?'info':'ok',t:'등록했습니다: '+r.칸+' · '+(f.행사명||f.문구)+(r.알림.length?' (참고: '+r.알림.join(', ')+')':'')};
    불러오기();
  });
}
function 칸이동(번호,n){실행('webMoveSlot',[번호,n],()=>{알림={k:'ok',t:n+'번 칸으로 옮겼습니다.'};불러오기();});}
function 결정(번호,k){
  let 사유='';
  if(k==='반려'){사유=prompt('반려 사유를 입력하세요. (신청자의 [내 신청]에 표시됩니다)');if(사유===null)return;if(!사유.trim()){alert('반려 사유를 입력하세요.');return;}}
  else if(!confirm('승인할까요?'))return;
  실행('webDecide',[번호,k,사유],()=>{알림={k:'ok',t:k+' 처리했습니다.'};불러오기();});
}
function 철거(번호){if(!confirm('현수막을 철거했습니까?'))return;실행('webRemoved',[번호],()=>{알림={k:'ok',t:'철거 완료를 기록했습니다.'};불러오기();});}
function 신청서(번호){
  const o=D.rows.find(x=>x.번호===번호);if(!o)return;
  const 같은=D.rows.filter(x=>x.번호.replace(/-\d+$/,'')===o.번호.replace(/-\d+$/,'')&&x.상태!=='취소');
  const 장소=D.set.장소.map(p=>{const x=같은.find(y=>y.장소===p);return (x?'■ ':'□ ')+esc(p)+(x&&x.칸?' ('+x.칸+'번 칸)':'');}).join('&nbsp;&nbsp;&nbsp;');
  const 날=s=>{const p=s.split('-');return p[0]+'. '+Number(p[1])+'. '+Number(p[2])+'.';};
  const 확인=같은.every(x=>x.상태!=='대기'&&x.처리자)?esc(같은[0].처리자)+' ('+esc(같은[0].상태)+', '+esc(같은[0].처리일시.slice(0,10))+')':'(승인 전)';
  const w=window.open('','_blank');
  if(!w){alert('팝업이 막혀 있습니다. 브라우저에서 팝업을 허용해 주세요.');return;}
  w.document.write('<!DOCTYPE html><html><head><meta charset="utf-8"><title>현수막 게시 신청서</title><style>'+
    'body{font-family:"Malgun Gothic",sans-serif;margin:40px;color:#000}h1{text-align:center;font-size:24px;letter-spacing:8px;margin:0 0 24px}'+
    'table{border-collapse:collapse;width:100%}th,td{border:1px solid #000;padding:10px;font-size:14px}th{background:#eee;width:120px}'+
    '.cap{text-align:center;background:#ddd;font-weight:bold;letter-spacing:6px}.note{font-size:12px;line-height:1.7;margin-top:18px}'+
    '.sign{margin-top:30px;text-align:right;line-height:2.2;font-size:14px}@media print{button{display:none}}</style></head><body>'+
    '<button onclick="print()" style="float:right;padding:6px 14px">인쇄</button><h1>현수막 게시 신청서</h1>'+
    '<table><tr><td class="cap" colspan="2">게 시 내 용</td></tr>'+
    '<tr><th>부서/학과</th><td>'+esc(o.부서)+' (담당자 '+esc(o.담당자)+', '+esc(o.연락처)+')</td></tr>'+
    '<tr><th>게시장소</th><td>'+장소+'</td></tr>'+
    '<tr><th>내 용</th><td><b>'+esc(o.행사명)+'</b><br><span style="white-space:pre-wrap">'+esc(o.문구)+'</span></td></tr>'+
    '<tr><th>게시기간</th><td>'+날(o.시작)+' ∼ '+날(o.종료)+' ('+일수글(o.시작,o.종료)+')'+(o.초과사유&&!직접(o)?'<br>'+D.set.기본일+'일 초과 사유: '+esc(o.초과사유):'')+'</td></tr></table>'+
    '<div class="note"><b>【 취업 홍보게시판 현수막 게시대 운영 안내 】</b><br>1. 현수막 규격 : 6100 × 700 (mm)<br>2. 게시위치 : '+D.set.장소.map(esc).join(' / ')+
    '<br>3. 게시 기간 : 기본 '+단위()+D.set.기본일+'일, 최대 '+단위()+D.set.최대일+'일(사안별 승인 필요) ※ 행사성 홍보물은 행사 종료 시 즉시 철거<br>4. 게시방법 : 신청 후 취업지원센터 승인 시 게시 가능<br>'+
    '※ 게시대 수량 부족 시 선정 기준에 따라 철거 요청(폐기)될 수 있음<br>※ 게시기간 만료된 현수막은 게시 요청 부서에서 직접 철거 및 폐기</div>'+
    '<div class="sign">신청일 : '+날(o.신청일시.slice(0,10))+'<br>신 청 자 : '+esc(o.담당자)+' ('+esc(o.계정)+')<br>확 인 자 : '+확인+'<br><span style="font-size:12px">신청번호 '+esc(o.번호.replace(/-\d+$/,''))+'</span></div></body></html>');
  w.document.close();
}

(function(){
  if(!주소||!공개키||주소.indexOf('여기에')>=0){
    document.getElementById('main').innerHTML='<div class="card login"><h2>설정이 필요합니다</h2><div class="msg err">config.js 파일에 Supabase 주소와 공개 키를 넣어 주세요.</div></div>';
    document.getElementById('me').textContent='';return;
  }
  const 받음=토큰받기();
  if(받음&&받음.오류){세션저장(null);로그인화면('로그인하지 못했습니다: '+받음.오류);return;}
  세션=세션읽기();
  if(!세션){로그인화면();return;}
  불러오기();
})();
</script>
