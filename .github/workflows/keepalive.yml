# Supabase 무료 플랜은 1주일 동안 사용이 없으면 일시정지됩니다.
# 이 작업이 3일마다 Supabase에 한 번 접속해서 일시정지를 막습니다.
name: Supabase 깨우기

on:
  schedule:
    - cron: '17 0 */3 * *'   # 3일마다 오전 9시 17분 (한국 시간)
  workflow_dispatch:          # Actions 화면에서 직접 실행할 때

permissions:
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Supabase 접속
        run: |
          curl -sS --fail --retry 3 --retry-delay 30 -X POST \
            "https://tkhwxjnboriykpkccrbr.supabase.co/rest/v1/rpc/keep_alive" \
            -H "apikey: sb_publishable_vwF5hBJEliSPj64ifd47fA_-xBUQbwo" \
            -H "Content-Type: application/json" -d '{}'
      - name: 예약 실행 유지 (저장소 활동이 60일 없을 때 꺼지는 것 방지)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable" || true
